        :root {

            --face: #d4d0c8;
            --shadow: #808080;
            --highlight: #ffffff;
            --dark-shadow: #404040;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            font-family: "MS Sans Serif", "Tahoma", Arial, sans-serif;
            font-size: 12px;
        }

        body {
            background-color: var(--win-bg);

            background-size: 25px 25px;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* CRT линии */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
            z-index: 99999;
            background-size: 100% 4px;
            pointer-events: none;

        /* Центральная сцена для проекции картинок */
        .background-stage {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4%;
            z-index: 1;
            pointer-events: none;

        /* Экраны-контейнеры для слайдшоу */
        .eva-monitor-screen {
            height: 80vh;

            position: relative;
            border: 1px solid rgba(255, 102, 0, 0.15);
            background: rgba(10, 5, 2, 0.3);
            overflow: hidden;

        .left-monitor {

            mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);

        .right-monitor {
            -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to left, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);

        /* Слайды с мягким переключением через opacity */
        .eva-slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            filter: grayscale(25%) saturate(140%) contrast(105%) opacity(0.4);

        .eva-slide.active {
            opacity: 1;

// ИСПРАВЛЕНО: Относительные пути к картинкам (без лидирующего слэша), чтобы убрать ошибки 404 на GitHub Pages
const pinImages = [
'./pin_fightclub.jpg',
'./pin_gosling.jpg',
'./pin_donnie.jpg',
'./pin_shinji.jpg',
'./pin_the_end.jpg',
'./pin_misatо.jpg'
];
// Инфраструктура слайдшоу для мониторов MAGI
function setupMonitors() {
const left = document.getElementById('left-monitor');
const right = document.getElementById('right-monitor');
pinImages.forEach((src, idx) => {
const sL = document.createElement('div');
sL.className = eva-slide slide-l-${idx};
sL.style.backgroundImage = url('${src}');
left.appendChild(sL);
const sR = document.createElement('div');
sR.className = eva-slide slide-r-${idx};
sR.style.backgroundImage = url('${src}');
right.appendChild(sR);
});
let currentIdx = 0;
setInterval(() => {
const slidesL = left.querySelectorAll('.eva-slide');
const slidesR = right.querySelectorAll('.eva-slide');
if(!slidesL.length) return;
slidesL.forEach(s => s.classList.remove('active'));
slidesR.forEach(s => s.classList.remove('active'));
currentIdx = (currentIdx + 1) % slidesL.length;
slidesL[currentIdx].classList.add('active');
let rIdx = (currentIdx + 2) % slidesR.length;
slidesR[rIdx].classList.add('active');
}, 4000);
}
setupMonitors();
// Аудио Движок
let audioCtx = null;
let mainAudioBuffer = null;
let sourceNode = null;
// Переменные состояния плеера
let isPlaying = false;
let startTime = 0;
let pausedAt = 0;
let currentPlaybackRate = 1.0;
let updateInterval = null;
// DOM элементы управления
const fileInput = document.getElementById('file-input');
const playBtn = document.getElementById('play-btn');
const saveBtn = document.getElementById('save-btn');
const tempoSlider = document.getElementById('tempo-slider');
const tempoVal = document.getElementById('tempo-val');
const resetBtn = document.getElementById('reset-btn');
const posSlider = document.getElementById('pos-slider');
const posText = document.getElementById('pos-text');
const statusText = document.getElementById('status-text');
const timeText = document.getElementById('time-text');
const playlistBox = document.getElementById('playlist-box');
const wheelL = document.getElementById('wheel-l');
const wheelR = document.getElementById('wheel-r');
// Инициализация AudioContext по первому же взаимодействию пользователя
function initAudioContext() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
}
// Вспомогательная функция красивого форматирования секунд в MM:SS
function formatTime(sec) {
const m = Math.floor(sec / 60).toString().padStart(2, '0');
const s = Math.floor(sec % 60).toString().padStart(2, '0');
return ${m}:${s};
}
// Обновление таймингов дисплея и положения ползунка прогресса
function updateDisplay() {
if (!mainAudioBuffer) return;
let currentPos = pausedAt;
if (isPlaying) {
currentPos = pausedAt + (audioCtx.currentTime - startTime) * currentPlaybackRate;
}
if (currentPos >= mainAudioBuffer.duration) {
currentPos = mainAudioBuffer.duration;
stopTrack();
}
posSlider.value = currentPos;
posText.textContent = formatTime(currentPos);
timeText.textContent = ${formatTime(currentPos)} / ${formatTime(mainAudioBuffer.duration)};
}
// Обработка выбора аудио-файла пользователем
fileInput.addEventListener('change', (e) => {
const file = e.target.files[0];
if (!file) return;
initAudioContext();
statusText.textContent = "LOADING AUDIO BUFFERS...";
playBtn.disabled = true;
saveBtn.disabled = true;
playlistBox.innerHTML = <div class="track-item">${file.name.toUpperCase()}</div>;
const reader = new FileReader();
reader.onload = function(evt) {
audioCtx.decodeAudioData(evt.target.result, function(buffer) {
mainAudioBuffer = buffer;
statusText.textContent = "DECODE SUCCESS // READY";
posSlider.disabled = false;
posSlider.max = buffer.duration;
posSlider.value = 0;
pausedAt = 0;
isPlaying = false;
playBtn.textContent = "▶ Play";
playBtn.disabled = false;
saveBtn.disabled = false;
updateDisplay();
}, function(err) {
statusText.textContent = "DECODE ERROR!";
console.error(err);
});
};
reader.readAsArrayBuffer(file);
});
// Запуск воспроизведения с конкретной временной метки
function playTrack(offset) {
if (!mainAudioBuffer) return;
initAudioContext();
sourceNode = audioCtx.createBufferSource();
sourceNode.buffer = mainAudioBuffer;
sourceNode.playbackRate.value = currentPlaybackRate;
sourceNode.connect(audioCtx.destination);
startTime = audioCtx.currentTime;
pausedAt = offset;
// Защита от перегрузки рейта смещения
sourceNode.start(0, offset);
isPlaying = true;
playBtn.textContent = "⏸ Pause";
statusText.textContent = "PLAYBACK ACTIVE";
wheelL.classList.add('spinning');
wheelR.classList.add('spinning');
clearInterval(updateInterval);
updateInterval = setInterval(updateDisplay, 250);
}
// Постановка воспроизведения на паузу
function pauseTrack() {
if (!isPlaying) return;
isPlaying = false;
clearInterval(updateInterval);
pausedAt += (audioCtx.currentTime - startTime) * currentPlaybackRate;
if (sourceNode) {
sourceNode.stop();
sourceNode.disconnect();
}
playBtn.textContent = "▶ Play";
statusText.textContent = "PAUSED";
wheelL.classList.remove('spinning');
wheelR.classList.remove('spinning');
updateDisplay();
}
// Полная остановка трека при завершении
function stopTrack() {
isPlaying = false;
clearInterval(updateInterval);
pausedAt = 0;
if (sourceNode) {
try { sourceNode.stop(); } catch(e){}
sourceNode.disconnect();
}
playBtn.textContent = "▶ Play";
statusText.textContent = "TRACK COMPLETED";
wheelL.classList.remove('spinning');
wheelR.classList.remove('spinning');
updateDisplay();
}
// Поведение кнопки Play/Pause
playBtn.addEventListener('click', () => {
if (isPlaying) {
pauseTrack();
} else {
playTrack(pausedAt);
}
});
// Логика изменения темпа через слайдер
tempoSlider.addEventListener('input', (e) => {
const val = parseFloat(e.target.value);
currentPlaybackRate = val;
tempoVal.textContent = val.toFixed(2) + 'x';
if (isPlaying) {
// Чтобы динамически менять рейт без заиканий, высчитываем текущую точку и перезапускаем ноду
let elapsed = (audioCtx.currentTime - startTime) * sourceNode.playbackRate.value;
pauseTrack();
pausedAt = pausedAt + elapsed;
playTrack(pausedAt);
}
});
// Кнопка сброса скорости
resetBtn.addEventListener('click', () => {
tempoSlider.value = 1.0;
currentPlaybackRate = 1.0;
tempoVal.textContent = '1.00x';
if (isPlaying) {
let elapsed = (audioCtx.currentTime - startTime) * sourceNode.playbackRate.value;
pauseTrack();
pausedAt = pausedAt + elapsed;
playTrack(pausedAt);
}
});
// Перемотка трека ползунком прогресса барa
posSlider.addEventListener('input', (e) => {
const targetPos = parseFloat(e.target.value);
if (isPlaying) {
pauseTrack();
pausedAt = targetPos;
playTrack(pausedAt);
} else {
pausedAt = targetPos;
updateDisplay();
}
});
// ==========================================
// ИСПРАВЛЕНО: Алгоритм Отрендерить & Сохранить как MP3
// ==========================================
saveBtn.addEventListener('click', () => {
if (!mainAudioBuffer) return;
const oldStatus = statusText.textContent;
statusText.textContent = "RENDERING MP3...";
saveBtn.disabled = true;
playBtn.disabled = true;
// Запускаем вращение кассеты на время рендеринга для анимации
wheelL.classList.add('spinning');
wheelR.classList.add('spinning');
const sampleRate = mainAudioBuffer.sampleRate;
const duration = mainAudioBuffer.duration;
// Рассчитываем итоговую длину трека с учетом изменения скорости
const targetDuration = duration / currentPlaybackRate;
// Инициализируем контекст оффлайн-рендеринга под измененную скорость
const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(
mainAudioBuffer.numberOfChannels,
sampleRate * targetDuration,
sampleRate
);
// Создаем виртуальную ноду буфера
const bufferSource = offlineCtx.createBufferSource();
bufferSource.buffer = mainAudioBuffer;
bufferSource.playbackRate.value = currentPlaybackRate; // накладываем измененный темп
bufferSource.connect(offlineCtx.destination);
bufferSource.start(0);
// Начинаем математический рендеринг звуковой волны в памяти браузера
offlineCtx.startRendering().then(function(renderedBuffer) {
// ИСПРАВЛЕНИЕ: Читаем реальное число аудиоканалов в буфере
const numChannels = renderedBuffer.numberOfChannels;
// Извлекаем данные левого аудиоканала (он гарантированно существует всегда)
const leftChannel = renderedBuffer.getChannelData(0);
// ИСПРАВЛЕНИЕ: Если трек стерео — берем правый канал, если моно — дублируем ссылку на левый!
// Это защищает lamejs от чтения undefined на монофонических файлах.
const rightChannel = numChannels > 1 ? renderedBuffer.getChannelData(1) : leftChannel;
// ИСПРАВЛЕНИЕ: Передаем кодировщику строго реальное количество каналов: numChannels > 1 ? 2 : 1
const mp3encoder = new lamejs.Mp3Encoder(numChannels > 1 ? 2 : 1, sampleRate, 192);
const mp3Data = [];
const sampleBlockSize = 1152; // Оптимальный размер блока обработки фрейма MP3
// Конвертируем Float32 данные из браузерного буфера в понятный lamejs Int16 битрейт
const leftInt16 = new Int16Array(leftChannel.length);
const rightInt16 = numChannels > 1 ? new Int16Array(rightChannel.length) : null;
for (let i = 0; i < leftChannel.length; i++) {
// Нормализация аудиопотока и защита от клиппинга звука
let sL = Math.max(-1, Math.min(1, leftChannel[i]));
leftInt16[i] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;
if (numChannels > 1) {
let sR = Math.max(-1, Math.min(1, rightChannel[i]));
rightInt16[i] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
}
}
// Порционное кодирование звука блоками
for (let i = 0; i < leftInt16.length; i += sampleBlockSize) {
const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
const rightChunk = numChannels > 1 ? rightInt16.subarray(i, i + sampleBlockSize) : leftChunk;
let mp3buf;
if (numChannels > 1) {
mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
} else {
mp3buf = mp3encoder.encodeBuffer(leftChunk);
}
if (mp3buf.length > 0) {
mp3Data.push(mp3buf);
}
}
// Сбрасываем и закрываем внутренний буфер кодировщика
const mp3buf = mp3encoder.flush();
if (mp3buf.length > 0) {
mp3Data.push(mp3buf);
}
// Формируем готовый MP3 файл в Blob объект
const blob = new Blob(mp3Data, { type: 'audio/mp3' });
const url = window.URL.createObjectURL(blob);
// Программная генерация триггера загрузки файла для пользователя
const a = document.createElement('a');
a.style.display = 'none';
a.href = url;
a.download = 'tempo_shifted_track.mp3';
document.body.appendChild(a);
a.click();
// Очистка памяти линков
setTimeout(() => {
document.body.removeChild(a);
window.URL.revokeObjectURL(url);
}, 100);
// Возвращаем интерфейс в рабочее состояние
statusText.textContent = "RENDER COMPLETED!";
saveBtn.disabled = false;
playBtn.disabled = false;
wheelL.classList.remove('spinning');
wheelR.classList.remove('spinning');
}).catch(function(err) {
statusText.textContent = "RENDER CRITICAL ERROR!";
console.error("Ошибка во время оффлайн-сборки аудио:", err);
saveBtn.disabled = false;
playBtn.disabled = false;
wheelL.classList.remove('spinning');
wheelR.classList.remove('spinning');
});
});
